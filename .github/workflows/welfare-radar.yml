name: linux.do welfare radar

on:
  schedule:
    # 08:40 Asia/Shanghai = 00:40 UTC
    - cron: "40 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run welfare radar
        run: python scripts/welfare_radar.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "welfare radar update"
          git push
